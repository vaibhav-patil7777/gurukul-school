{% extends "base.html" %}
{% block content %}
<style>
/* Neon Glass Card Style */
.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,255,255,0.4);
  border: 1px solid rgba(0,255,255,0.2);
  max-width: 500px;
  margin: 30px auto;
  transition: 0.3s;
}
.card:hover {
  box-shadow: 0 0 25px #00eaff;
}

/* Titles */
.card h3 {
  color: #00eaff;
  text-shadow: 0 0 10px #00eaff;
  margin-bottom: 15px;
}

/* Inputs */
input[type="file"], input[type="text"] {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid rgba(0,255,255,0.3);
  background: rgba(255,255,255,0.05);
  color: #fff;
  outline: none;
  transition: 0.2s;
  margin-bottom: 12px;
}
input:focus {
  border-color: #00eaff;
  box-shadow: 0 0 8px #00eaff;
}

/* Buttons */
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #00eaff;
  color: #000;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
.btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px #00eaff;
}

/* Responsive */
@media(max-width:480px){
  .card {
    padding: 15px;
    margin: 20px 10px;
  }
  input[type="text"], input[type="file"] {
    padding: 8px;
  }
  .btn {
    width: 100%;
    padding: 10px;
  }
}
</style>

<div class="card">
  <h3>Upload Media</h3>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="files" multiple accept="image/*,video/*">
    <input type="text" name="event" placeholder="Event name">
    <button class="btn" type="submit">Upload</button>
  </form>
</div>
{% endblock %}
